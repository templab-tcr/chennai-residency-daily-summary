function yearly(){let r=monthRows(),l=ledger(),totalIncome=total(r,'income'),totalExp=total(r,'expenses'),checkouts=total(r,'checkouts'),daily=l.map(x=>'<tr><td>'+dateLabel(x.date)+'</td><td class="num">'+x.checkOutCount+'</td>'+[x.opening,x.dayCash,x.dayCashExpenses,x.dayOnlineExpenses,x.dayClosing,x.nightCash,x.nightCashExpenses,x.nightOnlineExpenses,x.nightClosing,x.deposit,x.cashAfterDeposit,x.dayClosing-x.nightOpening+x.nightClosing-x.closingCash].map((v,i)=>'<td class="num"><span class="'+(i===11?(Math.abs(v)>0.005?'bad-check':'good-check'):'')+'">'+money(v)+'</span></td>').join('')+'</tr>');return '<div class="head"><div><h1>YEARLY SUMMARY · FULL REGISTER YEAR</h1><div class="muted">'+dateLabel(l[0].date)+' through '+dateLabel(l[l.length-1].date)+'</div></div></div><div class="cards">'+stat('Check-outs',checkouts)+stat('Total income',money(totalIncome))+stat('Total expenses',money(totalExp))+stat('Net',money(totalIncome-totalExp))+stat('Opening cash',money(l[0].opening))+stat('Ledger closing cash',money(l[l.length-1].closingCash))+stat('Drawer after deposit',money(l[l.length-1].cashAfterDeposit))+'</div><h3>Month-by-month totals</h3>'+monthlyTableCompact(r)+'<h3>Daily Day / Night cash roll-forward</h3>'+tbl(['Date','# Check-outs','Day opening','Day cash received','Day cash expense','Day online expense','Day closing / Night opening','Night cash received','Night cash expense','Night online expense','Night closing / Ledger closing','Deposits (separate)','Drawer after deposit','Check vs Daily Summary'],daily)}function monthlyTableCompact(r){let rows=r.map(x=>'<tr><td>'+monthLabel(x.month)+'</td><td class="num">'+x.checkouts+'</td>'+[x.dayIncome,x.nightIncome,x.income,x.cash,x.other,x.dayExp,x.nightExp,x.expenses,x.net,x.opening,x.closing].map(v=>'<td class="num">'+dashMoney(v)+'</td>').join('')+'</tr>');let t={};for(let k of ['checkouts','dayIncome','nightIncome','income','cash','other','dayExp','nightExp','expenses','net'])t[k]=total(r,k);rows.push('<tr class="t function heat(){let L=ledger(),keys={checkins:['Check-ins','checkInCount','count'],checkouts:['Check-outs','checkOutCount','count'],cash:['Cash received','cashReceived','money'],expenses:['Total expenses','totalExpenses','money'],change:['Cash change before deposit','cashChangeBeforeDeposit','money'],closing:['Closing cash','closingCash','money']},z=keys[heatMetric]||keys.checkins,vals=L.map(x=>x[z[1]]),mn=Math.min(...vals),mx=Math.max(...vals),sum=vals.reduce((a,b)=>a+b,0),peak=L[vals.indexOf(mx)],period=z[1]==='closingCash'?L[L.length-1].closingCash:sum,tiles=L.map(x=>'<button class="day" data-date="'+x.date+'" style="background:'+heatColor(x[z[1]],mn,mx)+'"><span>'+esc(z[2]==='count'?x[z[1]]:money(x[z[1]]))+'</span><span class="d">'+x.date.slice(8)+' '+new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{month:'short'})+'</span></button>').join('');return '<div class="head"><div><h1>DAILY HEAT MAP · 365 DAYS</h1><div class="muted">Heat values recalculate from daily Day / Night ledger totals.</div></div><label>Measure <select onchange="heatMetric=this.value;render()">'+Object.keys(keys).map(k=>'<option value="'+k+'" '+(heatMetric===k?'selected':'')+'>'+keys[k][0]+'</option>').join('')+'</select></label></div><div class="cards">'+stat('Measure',z[0])+stat(z[1]==='closingCash'?'Last day closing': 'Period total',z[2]==='count'?String(period):money(period))+stat('Peak date',dateLabel(peak.date))+stat('Peak value',z[2]==='count'?String(mx):money(mx))+'</div><div class="panel"><div class="toolbar"><span>Lower</span><span style="background:'+heatColor(mn,mn,mx)+';padding:8px 18px"></span><span style="background:'+heatColor((mn+mx)/2,mn,mx)+';padding:8px 18px"></span><span style="background:'+heatColor(mx,mn,mx)+';padding:8px 18px"></span><span>Higher</span></div><div class="heat">'+tiles+'</div></div><p class="foot">Check-ins/out use room counts. Expenses follow cash plus specified non-cash methods. Cash change subtracts cash and online expenses. Ledger closing carries the Night closing balance; deposits are displayed separately. Select a date cell for its daily account.</p>'}function heatColor(v,mn,mx){if(mn===mx)return 'hsl(205 55% 82%)';let r=(v-mn)/(mx-mn);return 'hsl('+(210-r*170)+' 58% '+(94-r*36)+'%)'}
function detailPage(k){return records(k)}function deposits(){let rs=db.deposits.map((x,i)=>'<tr><td>'+dateLabel(x['Business Date'])+'</td><td>'+dateLabel(x['Deposit Date'])+'</td><td>'+esc(x['Bank / Account'])+'</td><td>'+money(x['Amount (₹)'])+'</td><td>'+esc(x['Deposit Reference / Slip'])+'</td><td><button class="danger" onclick="removeEntry(\'deposits\','+i+')">Remove</button></td></tr>');return '<div class="head"><div><h1>Bank Deposits</h1><div class="muted">Deposits are tracked separately from ledger closing cash. Daily Summary also shows drawer cash after deposits.</div></div><button onclick="addDeposit()">+ Record deposit</button></div>'+tbl(['Business date','Deposit date','Bank / account','Amount','Reference',''],rs)}function addDeposit(){document.getElementById('app').innerHTML='<form id="depForm" class="panel"><h2>Record bank deposit</h2><div class="formgrid">'+field('Business Date','date',selectedDate,true)+field('Deposit Date','date',selectedDate)+field('Bank / Account','text')+field('Amount (₹)','number','',true)+field('Deposit Reference / Slip','text')+field('Prepared By','text')+field('Verified By','text')+'</div><div class="toolbar"><button>Save</button><button type="button" class="secondary" onclick="go(\'deposits\')">Cancel</button></div></form>';document.getElementById('depForm').onsubmit=saveDeposit}function saveDeposit(e){e.preventDefault();db.deposits.push(Object.fromEntries(new FormData(e.target)));persist();go('deposits')}
function advance(){let rows=[];for(let i=0;i<8;i++)rows.push('<tr><td><input name="room'+i+'" placeholder="e.g. 205"></td><td><input name="weight'+i+'" type="number" min="0.01" step="0.01" value="1"></td><td>'+(advanceResult[i]?money(advanceResult[i].amount):'—')+'</td></tr>');return '<div class="head"><div><h1>Split a Combined Advance</h1><div class="muted">Use equal weights for an even split, or enter room rates as weights.</div></div></div><form id="advanceForm" class="panel"><label>Combined advance (₹) <input name="total" type="number" min="0.01" step="0.01" required></label>'+tbl(['Room number','Rate / weight','Advance to enter'],rows)+ '<div class="toolbar"><button>Calculate split</button><button type="button" class="secondary" onclick="advanceResult=[];render()">Clear</button></div></form><div class="note">Enter each allocation on that room’s Check-In line and mark Advance = Yes. The final room receives any rounding remainder so the split totals exactly match the advance.</div>'}function calcAdvance(e){e.preventDefault();let totalAmount=num(new FormData(e.target).get('total')),a=[];for(let i=0;i<8;i++){let room=e.target.elements['room'+i].value.trim(),weight=num(e.target.elements['weight'+i].value)||1;if(room)a.push({room,weight})}if(!a.length){alert('Enter at least one room.');return}let w=total(a,'weight'),left=Math.round(totalAmount*100)/100;a.forEach((x,i)=>{x.amount=i===a.length-1?left:Math.round(totalAmount*x.weight/w*100)/100;left=Math.round((left-x.amount)*100)/100});advanceResult=a;render()}

function persist() {
  try {
    localStorage.setItem(STORE, JSON.stringify(db));

    document.getElementById('saveState').textContent =
      fileHandle ? 'Saving shared file…' : 'Saved in this browser';

    if (fileHandle) {
      saveToHandle();
    }

    const user = window.fb && window.fb.auth && window.fb.auth.currentUser;

    if (typeof pushDayToCloud === 'function' && user) {
      pushDayToCloud(selectedDate)
        .then(() => {
          document.getElementById('saveState').textContent = 'Synced to cloud';
        })
        .catch(e => {
          console.error('Cloud sync failed:', e);
        });
    }
  } catch (e) {
    document.getElementById('saveState').textContent = 'Export a backup';
    console.error('Save failed:', e);
  }
}


function validData(x) {
  return x &&
    [
      'checkins',
      'checkouts',
      'expenses',
      'deposits',
      'cashCloses',
      'monthEnds'
    ].every(k => Array.isArray(x[k])) &&
    x.settings;
}
async function openDataFile(){try{if(!window.showOpenFilePicker){alert('Direct local-file access is not available in this browser. Use Restore backup to import a JSON file.');return}let a=await window.showOpenFilePicker({types:[{description:'Lodge Accounts data',accept:{'application/json':['.json']}}],multiple:false});fileHandle=a[0];let x=JSON.parse(await(await fileHandle.getFile()).text());if(!validData(x))throw Error();db=x;localStorage.setItem(STORE,JSON.stringify(db));document.getElementById('saveState').textContent='Opened data file';render()}catch(e){if(e.name!=='AbortError')alert('Choose a valid Lodge Accounts JSON file.')}}async function saveDataFile(){try{if(!window.showSaveFilePicker){downloadBackup();return}fileHandle=await window.showSaveFilePicker({suggestedName:'Lodge_Accounts_Data.json',types:[{description:'Lodge Accounts data',accept:{'application/json':['.json']}}]});await saveToHandle()}catch(e){if(e.name!=='AbortError')alert('Could not save the data file. Download a backup instead.')}}function downloadBackup(){download(JSON.stringify(db,null,2),'Lodge_Accounts_Data.json','application/json')}function restoreBackup(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!validData(x))throw Error();db=x;fileHandle=null;persist();render()}catch(e){alert('That is not a Lodge Accounts backup.')}};r.readAsText(f)}function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function exportCsv(k){let a=db[k];if(!a.length){alert('No records to export.');return}let h=Object.keys(a[0]).filter(x=>x!=='_sourceRow');download([h.map(csvCell).join(','),...a.map(x=>h.map(k=>csvCell(x[k])).join(','))].join('\r\n'),'lodge-'+k+'.csv','text/csv;charset=utf-8')}function exportLedger(){let l=ledger(),rows=['Date,Opening Cash,Day Income,Day Cash,Day Expenses,Day Closing,Night Income,Night Cash,Night Expenses,Night Closing,Deposits,Full-Day Closing,Check-Outs',...l.map(x=>[x.date,x.opening,x.dayIncome,x.dayCash,x.dayExpenses,x.dayClosing,x.nightIncome,x.nightCash,x.nightCashExpenses,x.nightClosing,x.deposit,x.closingCash,x.checkOutCount].map(csvCell).join(','))];download(rows.join('\r\n'),'lodge-daily-ledger.csv','text/csv;charset=utf-8')}
render();
</script>
<script type="module">
  const COLLECTION = "tcr-summary-daily";
  const { auth, db: fsDb, signIn, signOut, onAuthStateChanged, collection, doc, setDoc, getDocs } = window.fb;

  // Build one day's document from the ledger, without calling ledgerFor()
  function dayDoc(dayKey, led) {
    return {
      date: dayKey,
      opening: led.opening,
      dayIncome: led.dayIncome,
      nightIncome: led.nightIncome,
      totalIncome: led.totalIncome,
      cashReceived: led.cashReceived,
      totalExpenses: led.totalExpenses,
      dayClosing: led.dayClosing,
      nightClosing: led.nightClosing,
      closingCash: led.closingCash,
      deposit: led.deposit,
      cashAfterDeposit: led.cashAfterDeposit,
      checkInCount: led.checkInCount,
      checkOutCount: led.checkOutCount,
      updatedAt: new Date().toISOString()
    };
  }

  window.cloudSignIn = async () => {
    const pw = prompt("Enter password for abc@gmail.com");
    if (!pw) return;
    try {
      await signIn(auth, "abc@gmail.com", pw);
    } catch (e) {
      alert("Sign-in failed: " + e.message);
    }
  };

  window.cloudSignOut = () => signOut(auth);

  window.pushDayToCloud = async (dayKey) => {
    const led = ledger().find(x => x.date === dayKey);
    if (!led) return;
    await setDoc(doc(fsDb, COLLECTION, dayKey), dayDoc(dayKey, led), { merge: true });
  };

  window.pushAllToCloud = async () => {
    const days = ledger().filter(d =>
      d.checkInCount || d.checkOutCount || d.totalExpenses || d.cashReceived
    );
    let ok = 0, failed = [];
    for (const led of days) {
      try {
        await setDoc(doc(fsDb, COLLECTION, led.date), dayDoc(led.date, led), { merge: true });
        ok++;
      } catch (e) {
        failed.push(led.date);
        console.error("Upload failed for", led.date, e);
      }
    }
    alert(`Uploaded ${ok} days.` + (failed.length ? ` Failed: ${failed.length} (see console).` : ""));
  };

window.pullFromCloud = async () => {
  const snap = await getDocs(collection(fsDb, COLLECTION));
  let merged = 0;
  snap.forEach(d => {
    const c = d.data();
    // Store cloud day summary so you can compare it
    db.cloudDays = db.cloudDays || {};
    db.cloudDays[c.date] = c;
    merged++;
  });
  persist();
  alert(`Loaded ${merged} days from the cloud.`);
  render();
};
</script>
